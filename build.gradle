plugins {
	id "fabric-loom" version "${loom_version}"
}

version = project.mod_version + "+mc" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/drevclient.accesswidener")

	runs {
		clientGameTest {
			// Optional hooks use require = 0 so other mods can't crash the game,
			// but the test treats any hook that didn't apply as a failure.
			jvmArguments.add("-Dmixin.debug.countInjections=true")
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Automated in-game test (./gradlew runClientGameTest), used by the GitHub workflow.
fabricApi.configureTests {
	createSourceSet = true
	enableGameTests = false
	enableClientGameTests = true
	modId = "drevclient_test"
	username = "DrevSS"
}
