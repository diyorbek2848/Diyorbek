# Builds DrevClient on GitHub for free. Push this folder to a GitHub repo,
# open the "Actions" tab, and download the jar from the "DrevClient" artifact.
name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DrevClient
          path: build/libs/*.jar
